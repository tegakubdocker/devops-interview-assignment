apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor
  namespace: video-analytics
  labels:
    app: video-processor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: video-processor
  template:
    metadata:
      labels:
        app: video-processor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: video-processor
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: video-processor
      containers:
      - name: video-processor
        image: 111111111111.dkr.ecr.us-east-1.amazonaws.com/video-processor:1.0.0
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1500m"
            memory: "1536Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: video-processor-config
              key: LOG_LEVEL
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: video-processor-config
              key: KAFKA_BROKERS
        - name: KAFKA_INPUT_TOPIC
          valueFrom:
            configMapKeyRef:
              name: video-processor-config
              key: KAFKA_INPUT_TOPIC
        - name: KAFKA_OUTPUT_TOPIC
          valueFrom:
            configMapKeyRef:
              name: video-processor-config
              key: KAFKA_OUTPUT_TOPIC
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: video-processor-config
              key: S3_BUCKET
        - name: S3_PREFIX
          valueFrom:
            configMapKeyRef:
              name: video-processor-config
              key: S3_PREFIX
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: video-processor-config
              key: AWS_REGION
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: video-processor-config
              key: PORT